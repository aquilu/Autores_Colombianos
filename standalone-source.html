<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palabras que cruzan fronteras · Atlas de autores colombianos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <!-- Resources referenced from JS code (lifted for the bundler) -->
  <meta name="ext-resource-dependency" content="data/dataset.json" data-resource-id="dataset" />
  <meta name="ext-resource-dependency" content="data/lij_dataset.json" data-resource-id="datasetLij" />
  <meta name="ext-resource-dependency" content="data/countries-110m.json" data-resource-id="worldAtlas" />
  <meta name="ext-resource-dependency" content="assets/lij-hero.png" />
  <meta name="ext-resource-dependency" content="assets/tinydesk-hero.png" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-ExtraLight.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-ExtraLightItalic.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-Light.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-LightItalic.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-Regular.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-Italic.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-Bold.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-BoldItalic.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-UltraBold.woff2" />
  <meta name="ext-resource-dependency" content="src/fonts/BLAA-UltraBoldItalic.woff2" />

  <link rel="stylesheet" href="src/blaa-fonts.css" />
  <link rel="stylesheet" href="src/theme.css" />
  <link rel="stylesheet" href="src/lij-theme.css" />
  <link rel="stylesheet" href="src/tinydesk-theme.css" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- D3 + topojson -->
  <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#f1e7d0">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#f1e7d0"/>
      <!-- compass / arc motif -->
      <g transform="translate(600 400)" fill="none" stroke="#14110d" stroke-width="2">
        <circle r="260" opacity="0.15"/>
        <circle r="200" opacity="0.25"/>
        <circle r="140" opacity="0.4"/>
        <circle r="80" opacity="0.6"/>
      </g>
      <g stroke="#8a2a1c" stroke-width="2" fill="none" opacity="0.75">
        <path d="M 600 400 Q 400 200 200 350" />
        <path d="M 600 400 Q 800 220 1000 360" />
        <path d="M 600 400 Q 500 600 350 660" />
        <path d="M 600 400 Q 750 600 900 640" />
      </g>
      <circle cx="600" cy="400" r="10" fill="#8a2a1c"/>
      <circle cx="200" cy="350" r="6" fill="#b58b3a"/>
      <circle cx="1000" cy="360" r="6" fill="#b58b3a"/>
      <circle cx="350" cy="660" r="6" fill="#b58b3a"/>
      <circle cx="900" cy="640" r="6" fill="#b58b3a"/>
      <text x="600" y="180" text-anchor="middle"
            font-family="Cormorant Garamond, Georgia, serif"
            font-style="italic" font-size="56" fill="#14110d">Palabras que cruzan</text>
      <text x="600" y="240" text-anchor="middle"
            font-family="Cormorant Garamond, Georgia, serif"
            font-style="italic" font-size="56" fill="#8a2a1c">fronteras.</text>
      <text x="600" y="720" text-anchor="middle"
            font-family="IBM Plex Mono, monospace" font-size="14"
            fill="#14110d" letter-spacing="6">ATLAS · AUTORES COLOMBIANOS</text>
    </svg>
  </template>
  <div id="root">
    <div class="boot">
      <div class="boot-mark">A · C</div>
      <div class="boot-label">cargando el atlas…</div>
    </div>
  </div>

  <!-- Load dataset, then components, then app -->
  <script>
    window.__BOOT__ = { startedAt: Date.now() };
    fetch(window.__resources?.dataset || 'data/dataset.json')
      .then(r => r.json())
      .then(d => { window.DATASET = d; window.dispatchEvent(new Event('dataset-ready')); })
      .catch(e => { document.getElementById('root').innerHTML = '<pre style="padding:2rem;color:#a33">No se pudo cargar el dataset: ' + e.message + '</pre>'; });
  </script>

  <script type="text/babel" src="src/utils.jsx"></script>
  <script type="text/babel" src="src/hero.jsx"></script>
  <script type="text/babel" src="src/atlas-colombia.jsx"></script>
  <script type="text/babel" src="src/atlas-world.jsx"></script>
  <script type="text/babel" src="src/network.jsx"></script>
  <script type="text/babel" src="src/mural.jsx"></script>
  <script type="text/babel" src="src/author-drawer.jsx"></script>
  <script type="text/babel" src="src/filters.jsx"></script>
  <script type="text/babel" src="src/data-story.jsx"></script>
  <script type="text/babel" src="src/lij/lij-hero.jsx"></script>
  <script type="text/babel" src="src/lij/lij-voces.jsx"></script>
  <script type="text/babel" src="src/lij/lij-world.jsx"></script>
  <script type="text/babel" src="src/lij/lij-ferias.jsx"></script>
  <script type="text/babel" src="src/lij/lij-cronologia.jsx"></script>
  <script type="text/babel" src="src/lij-app.jsx"></script>
  <script type="text/babel" src="src/tinydesk/td-hero.jsx"></script>
  <script type="text/babel" src="src/tinydesk/td-sessions.jsx"></script>
  <script type="text/babel" src="src/tinydesk/td-program.jsx"></script>
  <script type="text/babel" src="src/tinydesk/td-shelf.jsx"></script>
  <script type="text/babel" src="src/tinydesk-app.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
