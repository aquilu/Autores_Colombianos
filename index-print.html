<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palabras que cruzan fronteras · Atlas (impresión)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/blaa-fonts.css" />
  <link rel="stylesheet" href="src/theme.css" />
  <link rel="stylesheet" href="src/lij-theme.css" />

  <!-- Print-specific styles -->
  <style>
    :root {
      color-scheme: light;
    }

    /* Force background/colors in print */
    html, body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Print covers */
    .print-cover {
      min-height: 100vh;
      padding: 4rem 3rem;
      background: var(--ivory);
      display: grid;
      align-content: center;
      gap: 2rem;
      position: relative;
    }
    .print-cover::before {
      content: "";
      position: absolute; inset: 2rem;
      border: 1px solid var(--ink);
    }
    .print-cover-eyebrow {
      font-family: var(--f-mono);
      font-size: 0.75rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--rojo);
      position: relative;
    }
    .print-cover-title {
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 400;
      font-size: 7rem;
      line-height: 0.95;
      color: var(--ink);
      margin: 0;
      position: relative;
      max-width: 14ch;
    }
    .print-cover-title em {
      color: var(--rojo);
    }
    .print-cover-sub {
      font-family: var(--f-display);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--ink-soft);
      max-width: 56ch;
      position: relative;
    }
    .print-cover-meta {
      font-family: var(--f-mono);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
      position: relative;
    }

    .print-volume-divider {
      min-height: 60vh;
      padding: 4rem 3rem;
      background: var(--ink);
      color: var(--ivory);
      display: grid;
      align-content: center;
      gap: 1.5rem;
      page-break-before: always;
      break-before: page;
    }
    .print-volume-no {
      font-family: var(--f-mono);
      font-size: 0.8rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--dorado);
    }
    .print-volume-name {
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 400;
      font-size: 5rem;
      line-height: 1;
      color: var(--ivory);
      max-width: 14ch;
    }

    /* Print rules */
    @media print {
      @page {
        size: A4;
        margin: 0;
      }

      /* Hide interactive chrome that doesn't print */
      .tabnav,
      .filter-rail,
      .drawer-overlay,
      .drawer,
      .tip {
        display: none !important;
      }

      /* Make sections fit pages cleanly */
      .section,
      .hero,
      .lij-hero,
      .print-cover,
      .print-volume-divider,
      .colophon {
        page-break-after: auto;
        break-after: auto;
      }

      /* Cover and divider on their own page */
      .print-cover {
        page-break-after: always;
        break-after: page;
      }
      .print-volume-divider {
        page-break-before: always;
        break-before: page;
      }

      /* Avoid splitting cards */
      .voz-cell,
      .fair-card,
      .crono-item,
      .bar-row,
      .drawer-row,
      .colophon-grid > div {
        page-break-inside: avoid;
        break-inside: avoid;
      }

      /* Hero — let it breathe but cap height so we don't waste pages */
      .hero, .lij-hero {
        min-height: auto;
        page-break-after: always;
      }

      /* Disable sticky elements in print */
      [class*="sticky"], .filter-rail, .tabnav {
        position: static !important;
      }

      /* Network graph and complex SVGs — leave them but constrain */
      .ink-bg, .paper-bg {
        background-attachment: scroll !important;
      }
    }

    /* Hide elements that have no purpose in print no matter what */
    .lij-hero-cta,
    .hero-cta,
    .filter-rail {
      display: none;
    }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- D3 + topojson -->
  <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot-mark">A · C</div>
      <div class="boot-label">preparando impresión…</div>
    </div>
  </div>

  <!-- Enable print mode BEFORE any scripts run -->
  <script>
    window.__PRINT_MODE = true;
    window.__BOOT__ = { startedAt: Date.now() };

    // Eagerly load BOTH datasets in parallel
    Promise.all([
      fetch('data/dataset.json').then(r => r.json()),
      fetch('data/lij_dataset.json').then(r => r.json())
    ]).then(([adult, lij]) => {
      window.DATASET = adult;
      window.DATASET_LIJ = lij;
      window.dispatchEvent(new Event('dataset-ready'));
    }).catch(e => {
      document.getElementById('root').innerHTML = '<pre style="padding:2rem;color:#a33">No se pudo cargar el dataset: ' + e.message + '</pre>';
    });
  </script>

  <script type="text/babel" src="src/utils.jsx"></script>
  <script type="text/babel" src="src/hero.jsx"></script>
  <script type="text/babel" src="src/atlas-colombia.jsx"></script>
  <script type="text/babel" src="src/atlas-world.jsx"></script>
  <script type="text/babel" src="src/network.jsx"></script>
  <script type="text/babel" src="src/mural.jsx"></script>
  <script type="text/babel" src="src/author-drawer.jsx"></script>
  <script type="text/babel" src="src/filters.jsx"></script>
  <script type="text/babel" src="src/data-story.jsx"></script>
  <script type="text/babel" src="src/lij/lij-hero.jsx"></script>
  <script type="text/babel" src="src/lij/lij-voces.jsx"></script>
  <script type="text/babel" src="src/lij/lij-world.jsx"></script>
  <script type="text/babel" src="src/lij/lij-ferias.jsx"></script>
  <script type="text/babel" src="src/lij/lij-cronologia.jsx"></script>
  <script type="text/babel" src="src/lij-app.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <!-- Auto-print: wait for everything to settle, then fire print dialog -->
  <script type="text/babel">
    (async () => {
      // Wait for datasets to be ready
      if (!window.DATASET || !window.DATASET_LIJ) {
        await new Promise(r => window.addEventListener('dataset-ready', r, { once: true }));
      }
      // Wait for fonts
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      // Wait extra for maps + arcs animations to finish drawing
      await new Promise(r => setTimeout(r, 2500));
      window.print();
    })();
  </script>
</body>
</html>
